name: Build DeckInstall AppImage

on:
  push:
    branches:
      - "main"
      - "master"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"
      - "master"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run still in progress (a release tag is never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NUITKA_VERSION: "4.3.5"
  APPIMAGE_ARTIFACT: DeckInstall-AppImage

jobs:
  # Decides what this run has to do, so a release never repeats work that already passed on the same commit:
  #   main push     -> tests; the AppImage is compiled only when the push changes VERSION (a release commit)
  #   tag push      -> reuses the AppImage (and passing tests) of an earlier run on the same commit,
  #                    waiting for it when it is still running; compiles and tests here only as a fallback
  #   manual run    -> tests and AppImage
  #   pull request  -> tests
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      validate: ${{ steps.plan.outputs.validate }}
      build: ${{ steps.plan.outputs.build }}
      reuse_run: ${{ steps.plan.outputs.reuse_run }}
    steps:
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}  # this job has no checkout for gh to read the repository from
          BEFORE: ${{ github.event.before }}
        run: |
          validate=true
          build=false
          reuse_run=""

          # Newest other run of this workflow on this commit that succeeded (or is still going).
          # Cancelled and failed runs are skipped: a push run cancelled by a manual build of the same
          # commit must not hide that build (v0.36.0 was compiled again because of this).
          find_run() {
            gh run list --workflow "${{ github.workflow }}" --commit "$GITHUB_SHA" --limit 20 \
              --json databaseId,status,conclusion,event,createdAt \
              --jq "[.[] | select(.databaseId != ${{ github.run_id }})
                    | select(.event == \"push\" or .event == \"workflow_dispatch\")
                    | select(.status != \"completed\" or .conclusion == \"success\")]
                    | sort_by(.createdAt, .databaseId) | reverse | .[0] // empty"
          }

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            build=true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            deadline=$((SECONDS + 1800))
            misses=0
            while :; do
              if ! run=$(find_run); then
                echo "::warning::Could not list the runs of this commit; building here instead."
                break
              fi
              if [ -z "$run" ]; then
                # The run of the branch push may not be registered yet when both are pushed together.
                misses=$((misses + 1))
                [ "$misses" -ge 4 ] && break
                sleep 15
                continue
              fi
              status=$(jq -r .status <<<"$run")
              if [ "$status" = "completed" ]; then
                id=$(jq -r .databaseId <<<"$run")
                if [ "$(jq -r .conclusion <<<"$run")" = "success" ] && \
                   [ -n "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
                        --jq ".artifacts[] | select(.name == \"$APPIMAGE_ARTIFACT\" and .expired == false) | .id")" ]; then
                  reuse_run=$id
                fi
                break
              fi
              [ "$SECONDS" -ge "$deadline" ] && break
              sleep 20
            done
            if [ -n "$reuse_run" ]; then
              validate=false
            else
              build=true
            fi
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [[ ! "$BEFORE" =~ ^0+$ ]]; then
            # Release commits change VERSION: compile the AppImage once here so the tag can reuse it.
            if ! files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename'); then
              echo "::warning::Could not compare $BEFORE...$GITHUB_SHA; building the AppImage to be safe."
              files=VERSION
            fi
            if grep -qx VERSION <<<"$files"; then build=true; fi
          fi

          echo "validate=$validate" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "reuse_run=$reuse_run" >> "$GITHUB_OUTPUT"
          echo "plan: validate=$validate build=$build reuse_run=${reuse_run:-none}" | tee -a "$GITHUB_STEP_SUMMARY"

  validate-python:
    needs: plan
    if: needs.plan.outputs.validate == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ matrix.python-version }}-
      - name: Install test dependencies
        run: |
          # apt only for packages the runner image does not already have.
          missing=$(for p in libegl1 libgl1; do dpkg -s "$p" >/dev/null 2>&1 || echo "$p"; done)
          if [ -n "$missing" ]; then sudo apt-get update && sudo apt-get install -y $missing; fi
          python -m pip install --quiet uv
          uv pip install --system -e '.[dev]'
      - name: Lint and check types
        if: matrix.python-version == '3.11'
        run: |
          ruff check .
          mypy src
      - name: Run complete test suite (parallel, strict ResourceWarning + headless Qt)
        run: QT_QPA_PLATFORM=offscreen PYTHONPATH=src python -W error::ResourceWarning -m pytest -q -n auto -W error::ResourceWarning

  # Runs next to the tests (it does not wait for them); nothing is published before the release job.
  build-appimage:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-22.04
    env:
      # Nuitka would otherwise use ~/.cache/Nuitka/ccache/<abi>; pinning it makes the cached path the real one.
      CCACHE_DIR: /home/runner/.cache/ccache-nuitka

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install system graphics and build dependencies
        run: |
          missing=$(for p in libegl1 libgl1-mesa-dev patchelf librsvg2-bin desktop-file-utils ccache; do
            dpkg -s "$p" >/dev/null 2>&1 || echo "$p"; done)
          if [ -n "$missing" ]; then sudo apt-get update && sudo apt-get install -y $missing; fi

      # Caches written from the default branch are readable by tag and manual runs.
      - name: Cache ccache and Nuitka module cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ccache-nuitka
            ~/.cache/Nuitka
          key: nuitka-${{ runner.os }}-${{ env.NUITKA_VERSION }}-${{ github.sha }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ env.NUITKA_VERSION }}-

      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-build-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-build-

      - name: Install Python dependencies and Nuitka
        run: |
          python -m pip install --quiet uv
          uv pip install --system -e . "nuitka==${NUITKA_VERSION}"

      - name: Read and verify version
        id: meta
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          PKG_VER=$(PYTHONPATH=src python -c "import deckinstall; print(deckinstall.__version__)")
          test "$VERSION" = "$PKG_VER"
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME}" = "v${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify 256x256 PNG icon
        run: |
          if [ ! -f assets/icon.png ]; then
            rsvg-convert -w 256 -h 256 assets/icon.svg -o assets/icon.png
          fi

      - name: Compile standalone binary with Nuitka
        run: |
          PYTHONPATH=src python -m nuitka \
            --standalone \
            --enable-plugin=pyside6 \
            --include-package=deckinstall \
            --include-data-dir=src/deckinstall/locales=locales \
            --include-data-files=assets/icon.png=assets/icon.png \
            --lto=no \
            --python-flag=no_site \
            --jobs=$(nproc) \
            --nofollow-import-to=tkinter,unittest,pytest,ruff,mypy,pip,setuptools \
            --report=build/nuitka-report.xml \
            --output-dir=build \
            --output-filename=deckinstall \
            main.py
          ccache -s || true

      - name: Prepare AppDir and validate metadata
        run: |
          APPDIR="build/DeckInstall.AppDir"
          mv build/main.dist "$APPDIR"
          cp assets/deckinstall.desktop "$APPDIR/deckinstall.desktop"
          desktop-file-validate "$APPDIR/deckinstall.desktop"
          cp assets/icon.png "$APPDIR/deckinstall.png"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp assets/icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/deckinstall.png"
          cat <<'EOF' > "$APPDIR/AppRun"
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="$HERE:$PATH"
          exec "$HERE/deckinstall" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

      # winetricks + cabextract travel inside the AppImage: SteamOS has neither and its read-only
      # system loses anything installed at the next update (pre-tested on a Steam Deck: with them,
      # d3dcompiler_47 and vcrun2022 install with Valve's Proton 11).
      - name: Bundle winetricks and cabextract
        run: |
          TOOLS="build/DeckInstall.AppDir/tools"
          mkdir -p "$TOOLS"
          dpkg -s cabextract >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y cabextract; }
          cp /usr/bin/cabextract "$TOOLS/cabextract"
          cp "$(ldconfig -p | awk '/libmspack.so.0 / {print $NF; exit}')" "$TOOLS/libmspack.so.0"
          patchelf --set-rpath '$ORIGIN' "$TOOLS/cabextract"
          cp /usr/share/doc/cabextract/copyright "$TOOLS/cabextract.copyright"
          cp /usr/share/doc/libmspack0/copyright "$TOOLS/libmspack.copyright"
          WINETRICKS_TAG=20260125
          curl -fsSL -o "$TOOLS/winetricks" \
            "https://raw.githubusercontent.com/Winetricks/winetricks/${WINETRICKS_TAG}/src/winetricks"
          echo "431f82fc74000e6c864409f1d8fb495d696c03928808e3e8acffc45179312a7b  $TOOLS/winetricks" | sha256sum -c -
          curl -fsSL -o "$TOOLS/winetricks.COPYING" \
            "https://raw.githubusercontent.com/Winetricks/winetricks/${WINETRICKS_TAG}/COPYING"
          chmod 755 "$TOOLS/winetricks" "$TOOLS/cabextract"
          env -i PATH=/usr/bin:/bin "$TOOLS/cabextract" --version
          ldd "$TOOLS/cabextract" | grep -q "tools/libmspack.so.0"  # its own copy, not the system's
          sh -n "$TOOLS/winetricks"

      - name: Smoke test packaged AppDir
        run: |
          APPDIR="build/DeckInstall.AppDir"
          VER_OUT="$("$APPDIR/AppRun" --version)"
          echo "$VER_OUT"
          echo "$VER_OUT" | grep -qF "${{ steps.meta.outputs.version }}"
          timeout 30s env QT_QPA_PLATFORM=offscreen "$APPDIR/AppRun" --smoke-test
          LOG_FILE="$HOME/.local/share/DeckInstall/deckinstall.log"
          if [ -f "$LOG_FILE" ] && grep -q "Uncaught exception" "$LOG_FILE"; then
            cat "$LOG_FILE"
            exit 1
          fi

      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage" | sha256sum -c -
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            build/DeckInstall.AppDir \
            "DeckInstall-${{ steps.meta.outputs.version }}-x86_64.AppImage"
          sha256sum "DeckInstall-${{ steps.meta.outputs.version }}-x86_64.AppImage" > SHA256SUMS

      - name: Smoke test the AppImage file itself
        run: |
          APPIMAGE="./DeckInstall-${{ steps.meta.outputs.version }}-x86_64.AppImage"
          chmod +x "$APPIMAGE"
          # The runner may lack FUSE: --appimage-extract-and-run tests the same file without mounting it.
          "$APPIMAGE" --appimage-extract-and-run --version | grep -qF "${{ steps.meta.outputs.version }}"
          timeout 30s env QT_QPA_PLATFORM=offscreen "$APPIMAGE" --appimage-extract-and-run --smoke-test
          rc=0
          "$APPIMAGE" --appimage-extract-and-run --doctor --json > doctor.json || rc=$?
          test "$rc" -le 2
          python -c "import json; r = json.load(open('doctor.json')); assert r['app'][0]['detail'].endswith('${{ steps.meta.outputs.version }}'), r['app']"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APPIMAGE_ARTIFACT }}
          retention-days: 30
          path: |
            DeckInstall-*-x86_64.AppImage
            SHA256SUMS

      - name: Upload Nuitka report
        uses: actions/upload-artifact@v7
        with:
          name: nuitka-report
          retention-days: 14
          path: build/nuitka-report.xml

  # The built AppImage on other distros (desktop libraries installed, as on a real desktop).
  # Not a release gate: a failure here is a portability bug to look at, not a broken build.
  appimage-distros:
    needs: build-appimage
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:latest
            deps: dnf install -y mesa-libGL mesa-libEGL libxkbcommon fontconfig glib2 dbus-libs findutils
          - image: archlinux:latest
            deps: pacman -Syu --noconfirm mesa libxkbcommon fontconfig glib2 dbus findutils
          - image: ubuntu:24.04
            deps: apt-get update && apt-get install -y libgl1 libegl1 libxkbcommon0 libfontconfig1 libglib2.0-0 libdbus-1-3
    container: ${{ matrix.image }}
    steps:
      - name: Install desktop libraries
        run: ${{ matrix.deps }}
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.APPIMAGE_ARTIFACT }}
      - name: Run the AppImage
        run: |
          APPIMAGE=$(ls DeckInstall-*-x86_64.AppImage)
          chmod +x "$APPIMAGE"
          "./$APPIMAGE" --appimage-extract-and-run --version
          QT_QPA_PLATFORM=offscreen timeout 60s "./$APPIMAGE" --appimage-extract-and-run --smoke-test
          "./$APPIMAGE" --appimage-extract-and-run --doctor || test $? -le 2

  # Tag only: publishes the AppImage once the tests passed (here or on the reused run) and it was built.
  release:
    needs: [plan, validate-python, build-appimage]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') && needs.plan.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
      id-token: write      # Sigstore signature of the build provenance (no stored key)
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download the AppImage
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REUSE_RUN: ${{ needs.plan.outputs.reuse_run }}
        run: |
          src_run="${REUSE_RUN:-${{ github.run_id }}}"
          echo "AppImage from run $src_run" | tee -a "$GITHUB_STEP_SUMMARY"
          gh run download "$src_run" --name "$APPIMAGE_ARTIFACT" --dir dist

      - name: Verify version and checksum
        id: meta
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          cd dist
          test -f "DeckInstall-${VERSION}-x86_64.AppImage"
          sha256sum -c SHA256SUMS
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Signed provenance: anyone can check the file was built by this workflow from this tag with
      #   gh attestation verify DeckInstall-<version>-x86_64.AppImage --repo <owner>/DeckInstall
      - name: Sign the AppImage provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/DeckInstall-${{ steps.meta.outputs.version }}-x86_64.AppImage

      - name: Attach to GitHub Release
        if: github.ref_name == format('v{0}', steps.meta.outputs.version)
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/DeckInstall-${{ steps.meta.outputs.version }}-x86_64.AppImage
            dist/SHA256SUMS
