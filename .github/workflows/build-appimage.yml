name: Build DeckInstall AppImage

on:
  push:
    branches:
      - "main"
      - "master"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"
      - "master"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run still in progress (a release tag is never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NUITKA_VERSION: "4.3.5"
  APPIMAGE_ARTIFACT: DeckInstall-AppImage

jobs:
  # Decides what this run has to do, so a release never repeats work that already passed on the same commit:
  #   main push     -> tests; the AppImage is compiled only when the push changes VERSION (a release commit)
  #   tag push      -> reuses the AppImage (and passing tests) of an earlier run on the same commit,
  #                    waiting for it when it is still running; compiles and tests here only as a fallback
  #   manual run    -> tests and AppImage
  #   pull request  -> tests
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      validate: ${{ steps.plan.outputs.validate }}
      build: ${{ steps.plan.outputs.build }}
      reuse_run: ${{ steps.plan.outputs.reuse_run }}
    steps:
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          validate=true
          build=false
          reuse_run=""

          # Latest other run of this workflow on this commit that finished (or is still going) and is usable.
          find_run() {
            gh run list --workflow "${{ github.workflow }}" --commit "$GITHUB_SHA" --limit 20 \
              --json databaseId,status,conclusion,event \
              --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.event == \"push\" or .event == \"workflow_dispatch\")] | .[0] // empty"
          }

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            build=true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            deadline=$((SECONDS + 1800))
            misses=0
            while :; do
              run=$(find_run || true)
              if [ -z "$run" ]; then
                # The run of the branch push may not be registered yet when both are pushed together.
                misses=$((misses + 1))
                [ "$misses" -ge 4 ] && break
                sleep 15
                continue
              fi
              status=$(jq -r .status <<<"$run")
              if [ "$status" = "completed" ]; then
                id=$(jq -r .databaseId <<<"$run")
                if [ "$(jq -r .conclusion <<<"$run")" = "success" ] && \
                   [ -n "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
                        --jq ".artifacts[] | select(.name == \"$APPIMAGE_ARTIFACT\" and .expired == false) | .id")" ]; then
                  reuse_run=$id
                fi
                break
              fi
              [ "$SECONDS" -ge "$deadline" ] && break
              sleep 20
            done
            if [ -n "$reuse_run" ]; then
              validate=false
            else
              build=true
            fi
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [[ ! "$BEFORE" =~ ^0+$ ]]; then
            # Release commits change VERSION: compile the AppImage once here so the tag can reuse it.
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename' 2>/dev/null) || files=VERSION
            if grep -qx VERSION <<<"$files"; then build=true; fi
          fi

          echo "validate=$validate" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "reuse_run=$reuse_run" >> "$GITHUB_OUTPUT"
          echo "plan: validate=$validate build=$build reuse_run=${reuse_run:-none}" | tee -a "$GITHUB_STEP_SUMMARY"

  validate-python:
    needs: plan
    if: needs.plan.outputs.validate == 'true'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'requirements.txt') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ matrix.python-version }}-
      - name: Install test dependencies
        run: |
          # apt only for packages the runner image does not already have.
          missing=$(for p in libegl1 libgl1; do dpkg -s "$p" >/dev/null 2>&1 || echo "$p"; done)
          if [ -n "$missing" ]; then sudo apt-get update && sudo apt-get install -y $missing; fi
          python -m pip install --quiet uv
          uv pip install --system -e '.[dev]'
      - name: Lint and check types
        if: matrix.python-version == '3.11'
        run: |
          ruff check .
          mypy src
      - name: Run complete test suite (parallel, strict ResourceWarning + headless Qt)
        run: QT_QPA_PLATFORM=offscreen PYTHONPATH=src python -W error::ResourceWarning -m pytest -q -n auto -W error::ResourceWarning

  # Runs next to the tests (it does not wait for them); nothing is published before the release job.
  build-appimage:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-22.04
    env:
      # Nuitka would otherwise use ~/.cache/Nuitka/ccache/<abi>; pinning it makes the cached path the real one.
      CCACHE_DIR: /home/runner/.cache/ccache-nuitka

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install system graphics and build dependencies
        run: |
          missing=$(for p in libegl1 libgl1-mesa-dev patchelf librsvg2-bin desktop-file-utils ccache; do
            dpkg -s "$p" >/dev/null 2>&1 || echo "$p"; done)
          if [ -n "$missing" ]; then sudo apt-get update && sudo apt-get install -y $missing; fi

      # Caches written from the default branch are readable by tag and manual runs.
      - name: Cache ccache and Nuitka module cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ccache-nuitka
            ~/.cache/Nuitka
          key: nuitka-${{ runner.os }}-${{ env.NUITKA_VERSION }}-${{ github.sha }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ env.NUITKA_VERSION }}-

      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-build-${{ hashFiles('pyproject.toml', 'requirements.txt') }}
          restore-keys: |
            uv-${{ runner.os }}-build-

      - name: Install Python dependencies and Nuitka
        run: |
          python -m pip install --quiet uv
          uv pip install --system -e '.[dev]' "nuitka==${NUITKA_VERSION}"

      - name: Read and verify version
        id: meta
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          PKG_VER=$(PYTHONPATH=src python -c "import deckinstall; print(deckinstall.__version__)")
          test "$VERSION" = "$PKG_VER"
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME}" = "v${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify 256x256 PNG icon
        run: |
          if [ ! -f assets/icon.png ]; then
            rsvg-convert -w 256 -h 256 assets/icon.svg -o assets/icon.png
          fi

      - name: Compile standalone binary with Nuitka
        run: |
          PYTHONPATH=src python -m nuitka \
            --standalone \
            --enable-plugin=pyside6 \
            --include-package=deckinstall \
            --include-data-dir=src/deckinstall/locales=locales \
            --include-data-dir=assets=assets \
            --lto=no \
            --python-flag=no_site \
            --jobs=$(nproc) \
            --nofollow-import-to=tkinter,unittest,pytest,ruff,mypy,pip,setuptools \
            --report=build/nuitka-report.xml \
            --output-dir=build \
            --output-filename=deckinstall \
            main.py
          ccache -s || true

      - name: Prepare AppDir and validate metadata
        run: |
          APPDIR="build/DeckInstall.AppDir"
          mv build/main.dist "$APPDIR"
          cp assets/deckinstall.desktop "$APPDIR/deckinstall.desktop"
          desktop-file-validate "$APPDIR/deckinstall.desktop"
          cp assets/icon.png "$APPDIR/deckinstall.png"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp assets/icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/deckinstall.png"
          cat <<'EOF' > "$APPDIR/AppRun"
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="$HERE:$PATH"
          exec "$HERE/deckinstall" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

      - name: Smoke test packaged AppDir
        run: |
          APPDIR="build/DeckInstall.AppDir"
          VER_OUT="$("$APPDIR/AppRun" --version)"
          echo "$VER_OUT"
          echo "$VER_OUT" | grep -qF "${{ steps.meta.outputs.version }}"
          timeout 30s env QT_QPA_PLATFORM=offscreen "$APPDIR/AppRun" --smoke-test
          LOG_FILE="$HOME/.local/share/DeckInstall/deckinstall.log"
          if [ -f "$LOG_FILE" ] && grep -q "Uncaught exception" "$LOG_FILE"; then
            cat "$LOG_FILE"
            exit 1
          fi

      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage" | sha256sum -c -
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            build/DeckInstall.AppDir \
            "DeckInstall-${{ steps.meta.outputs.version }}-x86_64.AppImage"
          sha256sum "DeckInstall-${{ steps.meta.outputs.version }}-x86_64.AppImage" > SHA256SUMS

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APPIMAGE_ARTIFACT }}
          retention-days: 30
          path: |
            DeckInstall-*-x86_64.AppImage
            SHA256SUMS

      - name: Upload Nuitka report
        uses: actions/upload-artifact@v7
        with:
          name: nuitka-report
          retention-days: 14
          path: build/nuitka-report.xml

  # Tag only: publishes the AppImage once the tests passed (here or on the reused run) and it was built.
  release:
    needs: [plan, validate-python, build-appimage]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') && needs.plan.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download the AppImage
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ needs.plan.outputs.reuse_run }}
        run: |
          src_run="${REUSE_RUN:-${{ github.run_id }}}"
          echo "AppImage from run $src_run" | tee -a "$GITHUB_STEP_SUMMARY"
          gh run download "$src_run" --name "$APPIMAGE_ARTIFACT" --dir dist

      - name: Verify version and checksum
        id: meta
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          cd dist
          test -f "DeckInstall-${VERSION}-x86_64.AppImage"
          sha256sum -c SHA256SUMS
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/DeckInstall-${{ steps.meta.outputs.version }}-x86_64.AppImage
            dist/SHA256SUMS
