name: Build DeckInstall AppImage

on:
  push:
    branches:
      - "main"
      - "master"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"
      - "master"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system graphics and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-dev patchelf librsvg2-bin desktop-file-utils

      - name: Install Python dependencies and Nuitka
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka ruff

      - name: Read and verify version
        id: meta
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          PKG_VER=$(PYTHONPATH=src python -c "import deckinstall; print(deckinstall.__version__)")
          test "$VERSION" = "$PKG_VER"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify 256x256 PNG icon
        run: |
          if [ ! -f assets/icon.png ]; then
            rsvg-convert -w 256 -h 256 assets/icon.svg -o assets/icon.png
          fi

      - name: Run unit tests (strict ResourceWarning + headless Qt)
        run: |
          QT_QPA_PLATFORM=offscreen PYTHONPATH=src python -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Compile standalone binary with Nuitka
        run: |
          PYTHONPATH=src python -m nuitka \
            --standalone \
            --enable-plugin=pyside6 \
            --include-package=deckinstall \
            --include-data-dir=src/deckinstall/locales=locales \
            --include-data-dir=assets=assets \
            --output-dir=build \
            --output-filename=deckinstall \
            main.py

      - name: Prepare AppDir and validate metadata
        run: |
          APPDIR="build/DeckInstall.AppDir"
          mv build/main.dist "$APPDIR"
          cp assets/deckinstall.desktop "$APPDIR/deckinstall.desktop"
          desktop-file-validate "$APPDIR/deckinstall.desktop"
          cp assets/icon.png "$APPDIR/deckinstall.png"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp assets/icon.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/deckinstall.png"
          cat <<'EOF' > "$APPDIR/AppRun"
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(dirname "$(readlink -f "$0")")"
          export PATH="$HERE:$PATH"
          export QT_QPA_PLATFORMTHEME="${QT_QPA_PLATFORMTHEME:-xdgdesktopportal}"
          exec "$HERE/deckinstall" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

      - name: Smoke test packaged AppDir
        run: |
          APPDIR="build/DeckInstall.AppDir"
          "$APPDIR/AppRun" --version
          QT_QPA_PLATFORM=offscreen "$APPDIR/AppRun" --smoke-test

      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage" | sha256sum -c -
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            build/DeckInstall.AppDir \
            "DeckInstall-${{ steps.meta.outputs.version }}-x86_64.AppImage"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeckInstall-AppImage
          path: "DeckInstall-*-x86_64.AppImage"

      - name: Attach to GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "DeckInstall-*-x86_64.AppImage"
