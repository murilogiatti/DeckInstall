[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deckinstall"
version = "0.5.4"
description = "Easy Non-Steam Game Installer & Artwork Manager for Steam Deck"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7.0",
    "vdf>=3.4",
    "requests>=2.31.0",
]

[project.scripts]
deckinstall = "deckinstall.ui:main"
