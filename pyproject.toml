[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deckinstall"
dynamic = ["version"]
description = "Non-Steam Game Installer, Prefix Migrator, Save Validator & Artwork Manager for Steam Deck"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Murilo Giatti"}]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7.0,<7",
    "vdf>=3.4,<4",
    "requests>=2.31.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.6.0,<1",
    "mypy>=1.11.0,<2",
]

[project.urls]
Homepage = "https://github.com/murilogiatti/DeckInstall"
Repository = "https://github.com/murilogiatti/DeckInstall"
Issues = "https://github.com/murilogiatti/DeckInstall/issues"

[project.scripts]
deckinstall = "deckinstall.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "deckinstall.__version__"}

[tool.setuptools.package-data]
deckinstall = ["locales/*.json", "assets/icon.png", "assets/icon.svg"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["vdf", "vdf.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
