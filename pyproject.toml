[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deckinstall"
version = "0.7.2"
description = "Non-Steam Game Installer, Prefix Migrator, Save Validator & Artwork Manager for Steam Deck"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Murilo Giatti"}]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7.0",
    "vdf>=3.4",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/murilogiatti/DeckInstall"
Repository = "https://github.com/murilogiatti/DeckInstall"
Issues = "https://github.com/murilogiatti/DeckInstall/issues"

[project.scripts]
deckinstall = "deckinstall.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deckinstall = ["locales/*.json"]
